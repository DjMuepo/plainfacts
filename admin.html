<!doctype html>
<html>
<head>
  <title>PlainFacts Newsletter</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="newsletter">
  <main class="page">
    <h1>PlainFacts Newsletter</h1>
    <p>Choose the topics you want delivered in plain language.</p>

    <input id="email" placeholder="Email address">

    <label><input type="checkbox" value="global"> Global</label>
    <label><input type="checkbox" value="domestic"> Domestic</label>
    <label><input type="checkbox" value="economy"> Economy</label>
    <label><input type="checkbox" value="markets"> Markets</label>

    <button onclick="signupNewsletter()">Sign Up</button>
    <p id="result"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
